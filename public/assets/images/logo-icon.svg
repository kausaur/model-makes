<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="iconCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0099FF"/>
    </linearGradient>
    <linearGradient id="iconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC837"/>
      <stop offset="50%" stop-color="#FF8008"/>
      <stop offset="100%" stop-color="#FF4E50"/>
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Circle -->
  <circle cx="32" cy="32" r="30" fill="rgba(255, 107, 53, 0.08)"/>

  <!-- ================= NOZZLE & NODES CRAFT EMBLEM ================= -->
  <!-- Top collar -->
  <path d="M22 22 L42 22 L45 28 L19 28 Z" fill="url(#iconGold)"/>
  
  <!-- Tapered Nozzle Cone -->
  <path d="M19 28 L45 28 L37 43 L27 43 Z" fill="url(#iconGold)"/>
  
  <!-- Extrusion Tip -->
  <path d="M27 43 L37 43 L35 49 L29 49 Z" fill="#FFC837"/>

  <!-- Center Metallic Highlight -->
  <polygon points="32,22 36,28 34,43 32,49 30,43 28,28" fill="#FFFFFF" opacity="0.32"/>

  <!-- Connecting Node Filaments -->
  <path d="M14 16 L32 10 L50 16" stroke="url(#iconCyan)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32 10 L32 22" stroke="url(#iconCyan)" stroke-width="1.8" stroke-dasharray="2 2"/>
  <path d="M14 16 L22 22" stroke="url(#iconCyan)" stroke-width="2" stroke-linecap="round"/>
  <path d="M50 16 L42 22" stroke="url(#iconCyan)" stroke-width="2" stroke-linecap="round"/>

  <!-- Nodes -->
  <circle cx="32" cy="10" r="4" fill="url(#iconCyan)" filter="url(#iconGlow)"/>
  <circle cx="32" cy="10" r="1.5" fill="#FFFFFF"/>

  <circle cx="14" cy="16" r="3.5" fill="url(#iconCyan)"/>
  <circle cx="14" cy="16" r="1.2" fill="#FFFFFF"/>

  <circle cx="50" cy="16" r="3.5" fill="url(#iconCyan)"/>
  <circle cx="50" cy="16" r="1.2" fill="#FFFFFF"/>

  <!-- Molten Bead -->
  <circle cx="32" cy="54" r="3.2" fill="#FFC837" filter="url(#iconGlow)"/>
  <circle cx="32" cy="54" r="1.2" fill="#FFFFFF"/>
</svg>